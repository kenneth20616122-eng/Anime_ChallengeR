<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動漫女角色抽籤箱</title>
  <script src="characters.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3ea;
      --panel: #fffdf8;
      --ink: #221f1b;
      --muted: #776f64;
      --line: #ded5c6;
      --accent: #d64045;
      --accent-2: #167c80;
      --gold: #c9942f;
      --shadow: 0 18px 48px rgba(45, 35, 20, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(214, 64, 69, .12), transparent 26rem),
        radial-gradient(circle at 88% 8%, rgba(22, 124, 128, .14), transparent 22rem),
        linear-gradient(135deg, #fbf7ee 0%, var(--bg) 48%, #eef4f1 100%);
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: .95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 760px;
    }

    .owner-line {
      margin: 8px 0 0;
      color: var(--accent-2);
      font-weight: 800;
      min-height: 24px;
    }

    .status-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: min(420px, 100%);
    }

    .stat {
      min-height: 74px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, .72);
      padding: 12px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: .84rem;
      white-space: nowrap;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      font-size: 1.45rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
      gap: 18px;
      align-items: start;
    }

    .stage {
      min-height: 660px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, .86);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .result-card {
      display: grid;
      grid-template-columns: minmax(260px, .9fr) minmax(260px, 1.1fr);
      min-height: 660px;
    }

    .portrait {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 420px;
      background:
        linear-gradient(150deg, rgba(214,64,69,.24), rgba(22,124,128,.2)),
        repeating-linear-gradient(135deg, rgba(255,255,255,.42) 0 8px, transparent 8px 17px);
      overflow: hidden;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .portrait.has-image img {
      display: block;
    }

    .placeholder {
      width: min(72%, 280px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 253, 248, .72);
      border: 2px dashed rgba(34,31,27,.24);
      color: rgba(34,31,27,.62);
      text-align: center;
      padding: 22px;
      line-height: 1.45;
    }

    .portrait.has-image .placeholder {
      display: none;
    }

    .rank-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      min-width: 86px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255,253,248,.88);
      border: 1px solid rgba(255,255,255,.8);
      font-weight: 800;
      color: var(--accent);
      backdrop-filter: blur(12px);
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(22px, 4vw, 44px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-2);
      font-weight: 700;
    }

    .character-name {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.9rem);
      line-height: 1.02;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .series {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.28rem);
      line-height: 1.5;
    }

    .loading {
      min-height: 28px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .94rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .primary {
      min-height: 54px;
      min-width: 160px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      padding: 0 22px;
      box-shadow: 0 10px 24px rgba(214,64,69,.24);
    }

    .secondary {
      min-height: 46px;
      min-width: 108px;
      border-radius: 8px;
      background: #f0e7d8;
      color: var(--ink);
      padding: 0 15px;
      border: 1px solid var(--line);
      font-weight: 700;
    }

    .image-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }

    .image-tools input {
      min-width: 0;
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      padding: 0 12px;
    }

    .side {
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, .86);
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .progress {
      height: 12px;
      border-radius: 999px;
      background: #e8ddca;
      overflow: hidden;
      border: 1px solid rgba(34,31,27,.08);
    }

    .bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-2), var(--gold));
      transition: width .25s ease;
    }

    .history {
      display: grid;
      gap: 8px;
      max-height: 330px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.52);
    }

    .history-item b {
      font-size: .95rem;
      overflow-wrap: anywhere;
    }

    .history-item span {
      display: block;
      color: var(--muted);
      font-size: .82rem;
      margin-top: 3px;
    }

    .history-rank {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #efe4d1;
      color: var(--accent);
      font-weight: 800;
    }

    .roster-tools {
      display: grid;
      gap: 10px;
    }

    .roster-tools select,
    .roster-tools input {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 8px 10px;
      font: inherit;
    }

    .roster-tools select {
      min-height: 156px;
    }

    .roster-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .roster-actions .secondary {
      min-width: 0;
      width: 100%;
      padding: 0 10px;
    }

    .owner-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .owner-tools input,
    .sheet-tools input {
      min-width: 0;
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      padding: 0 12px;
    }

    .sheet-tools {
      display: grid;
      gap: 8px;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .sheet-actions .secondary {
      min-width: 0;
      width: 100%;
      padding: 0 10px;
    }

    .empty {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      max-width: min(520px, calc(100% - 32px));
      border-radius: 8px;
      background: rgba(34,31,27,.92);
      color: white;
      padding: 12px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @media (max-width: 920px) {
      header, main, .result-card {
        grid-template-columns: 1fr;
      }

      header {
        align-items: start;
      }

      .stage, .result-card {
        min-height: auto;
      }

      .portrait {
        min-height: 390px;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .status-strip {
        grid-template-columns: 1fr;
      }

      .image-tools {
        grid-template-columns: 1fr;
      }

      .owner-tools {
        grid-template-columns: 1fr;
      }

      .sheet-actions {
        grid-template-columns: 1fr;
      }

      .primary, .secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>動漫女角色抽籤箱</h1>
        <p class="subtitle">每抽一次會從剩餘名單中挑出一位，已抽結果會存在這台裝置的瀏覽器裡；抽完前不會重複。</p>
        <p class="owner-line" id="ownerLine"></p>
      </div>
      <div class="status-strip" aria-label="抽籤狀態">
        <div class="stat"><span>總名單</span><strong id="totalCount">100</strong></div>
        <div class="stat"><span>已抽出</span><strong id="drawnCount">0</strong></div>
        <div class="stat"><span>剩餘</span><strong id="remainingCount">100</strong></div>
      </div>
    </header>

    <main>
      <section class="stage" aria-live="polite">
        <article class="result-card" id="shareCard">
          <div class="portrait" id="portrait">
            <img id="characterImage" alt="">
            <div class="placeholder" id="placeholder">按下抽選後，角色照片會顯示在這裡</div>
            <div class="rank-badge" id="rankBadge">READY</div>
          </div>
          <div class="content">
            <div>
              <p class="eyebrow" id="eyebrow">二創挑戰名單</p>
              <h2 class="character-name" id="characterName">今天要畫誰？</h2>
              <p class="series" id="seriesName">按下抽選，從 100 位角色裡抽出不重複結果。</p>
              <p class="loading" id="imageStatus"></p>
              <div class="image-tools">
                <input id="manualImageUrl" type="url" placeholder="貼上照片網址，可覆蓋目前角色圖片">
                <button class="secondary" id="saveImageBtn">套用照片</button>
              </div>
            </div>
            <div class="actions">
              <button class="primary" id="drawBtn">抽選一名</button>
              <button class="secondary" id="copyBtn">複製結果</button>
              <button class="secondary" id="downloadBtn">下載卡片</button>
              <button class="secondary" id="resetBtn">重置</button>
            </div>
          </div>
        </article>
      </section>

      <aside class="side">
        <section class="panel">
          <h2>名字設定</h2>
          <div class="owner-tools">
            <input id="ownerNameInput" type="text" placeholder="輸入你的名字">
            <button class="secondary" id="saveOwnerNameBtn">儲存</button>
          </div>
        </section>

        <section class="panel">
          <h2>抽籤進度</h2>
          <div class="progress" aria-hidden="true"><div class="bar" id="progressBar"></div></div>
        </section>

        <section class="panel">
          <h2>最近抽出</h2>
          <div class="history" id="history"></div>
        </section>

        <section class="panel">
          <h2>照片來源</h2>
          <p class="empty">抽到角色時會先查詢公開角色資料庫。若照片不準，可貼上你喜歡的圖片網址並套用；設定會留在這台裝置。</p>
        </section>

        <section class="panel">
          <h2>Google Sheet 同步</h2>
          <div class="sheet-tools">
            <input id="sheetUrlInput" type="url" placeholder="貼上發佈成 CSV 的 Google Sheet 連結">
            <div class="sheet-actions">
              <button class="secondary" id="saveSheetUrlBtn">儲存同步</button>
              <button class="secondary" id="reloadSheetBtn">重新載入</button>
              <button class="secondary" id="copySheetLinkBtn">複製分享連結</button>
              <button class="secondary" id="clearSheetUrlBtn">停用同步</button>
            </div>
            <p class="empty" id="sheetStatus">尚未設定 Google Sheet。</p>
          </div>
        </section>

        <section class="panel">
          <h2>名單管理</h2>
          <div class="roster-tools">
            <select id="rosterSelect" size="7" aria-label="角色名單"></select>
            <input id="rosterName" type="text" placeholder="角色名稱">
            <input id="rosterSeries" type="text" placeholder="作品名稱">
            <input id="rosterImage" type="url" placeholder="照片網址，可留空">
            <input id="importRosterFile" type="file" accept=".json,application/json">
            <div class="roster-actions">
              <button class="secondary" id="newCharacterBtn">清空欄位</button>
              <button class="secondary" id="saveCharacterBtn">新增/更新</button>
              <button class="secondary" id="deleteCharacterBtn">刪除角色</button>
              <button class="secondary" id="exportRosterBtn">匯出名單</button>
              <button class="secondary" id="importRosterBtn">匯入名單</button>
              <button class="secondary" id="exportLocalBtn">匯出草稿</button>
            </div>
            <p class="empty" id="localDraftStatus"></p>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "anime-lottery-drawn-v1";
    const IMAGE_KEY = "anime-lottery-images-v1";
    const ROSTER_KEY = "anime-lottery-roster-v1";
    const LOCAL_ROSTER_KEY = "anime-lottery-local-roster-v1";
    const OWNER_KEY = "anime-lottery-owner-v1";
    const SHEET_URL_KEY = "anime-lottery-sheet-url-v1";
    const API_DELAY_MS = 900;
    const PHOTO_ALIASES = {
      1: "Rem", 2: "Alya Kujou", 3: "Miku Nakano", 4: "Kaguya Shinomiya", 5: "Chisato Nishikigi",
      6: "Megumin", 7: "Emilia Re Zero", 8: "Siesta", 9: "Nino Nakano", 10: "Elaina",
      11: "Ai Hoshino", 12: "Chinatsu Kano", 13: "Mahiru Shiina", 14: "Violet Evergarden", 15: "Mikoto Misaka",
      16: "Itsuki Nakano", 17: "Yotsuba Nakano", 18: "Ram Re Zero", 19: "Chizuru Mizuhara", 20: "Kaoruko Waguri",
      21: "Takina Inoue", 22: "Kagura Gintama", 23: "Shana", 24: "Nagi Sanzenin", 25: "Louise de la Valliere",
      26: "Nazuna Nanakusa", 27: "Takagi", 28: "Hina Chouno", 29: "Yuki Suou", 30: "Fenrys",
      31: "Yukino Yukinoshita", 32: "Ai Hayasaka", 33: "Ichika Nakano", 34: "Sinon", 35: "Shikimori",
      36: "Megumi Kato", 37: "Anna Yamada", 38: "Tatiana Undead Unluck", 39: "Hitori Gotou", 40: "Shuna",
      41: "Roxy Migurdia", 42: "Chino Kafuu", 43: "Asuna Yuuki", 44: "Taiga Aisaka", 45: "Mai Sakurajima",
      46: "Marin Kitagawa", 47: "Chika Fujiwara", 48: "Alice Synthesis Thirty", 49: "Nao Tomori", 50: "Beatrice Re Zero",
      51: "Asuka Langley Soryu", 52: "Aria Kanzaki", 53: "Rikka Takanashi", 54: "Rei Ayanami", 55: "Milim Nava",
      56: "Kanao Tsuyuri", 57: "Shinobu Kochou", 58: "Yui Yuigahama", 59: "Lilysa Amano", 60: "Reze",
      61: "Runa Shirakawa", 62: "Yor Forger", 63: "Juliet Persia", 64: "Ubel Frieren", 65: "Mikasa Ackerman",
      66: "Himiko Toga", 67: "Eru Chitanda", 68: "Ayano Yugiri", 69: "Kosaki Onodera", 70: "Kana Arima",
      71: "Ruby Hoshino", 72: "Mikari Tachibana", 73: "Shiori Katase", 74: "Uta One Piece", 75: "Rize Tedeza",
      77: "Serena Pokemon", 78: "Beta Eminence in Shadow", 79: "Kurumi Lycoris Recoil", 80: "Anya Forger",
      81: "Iroha Isshiki", 82: "Iris Konosuba", 83: "Frieren", 84: "Terakomari Gandesblood", 85: "Kei Shirogane",
      86: "Boa Hancock", 87: "Homura Akemi", 88: "Ryu Lion", 89: "Shizuka Yoshimoto", 91: "Aqua Konosuba",
      92: "Yukime Hell Teacher Nube", 93: "Golden Darkness", 94: "Artoria Pendragon Saber", 95: "Misaki Shokuhou",
      96: "Hina Amano", 97: "Shoko Makinohara", 98: "Umaru Doma", 99: "Echidna Re Zero", 100: "Ai Haibara"
    };

    const state = {
      characters: normalizeCharacters(readJson(ROSTER_KEY, window.CHARACTERS || [])),
      drawnRanks: readJson(STORAGE_KEY, []),
      customImages: readJson(IMAGE_KEY, {}),
      localCharacters: normalizeCharacters(readJson(LOCAL_ROSTER_KEY, [])),
      ownerName: localStorage.getItem(OWNER_KEY) || "",
      sheetUrl: new URLSearchParams(location.search).get("sheet") || localStorage.getItem(SHEET_URL_KEY) || "",
      current: null,
      lastApiAt: 0
    };

    const els = {
      total: document.getElementById("totalCount"),
      drawn: document.getElementById("drawnCount"),
      remaining: document.getElementById("remainingCount"),
      bar: document.getElementById("progressBar"),
      history: document.getElementById("history"),
      portrait: document.getElementById("portrait"),
      image: document.getElementById("characterImage"),
      placeholder: document.getElementById("placeholder"),
      rank: document.getElementById("rankBadge"),
      eyebrow: document.getElementById("eyebrow"),
      name: document.getElementById("characterName"),
      series: document.getElementById("seriesName"),
      status: document.getElementById("imageStatus"),
      manualUrl: document.getElementById("manualImageUrl"),
      draw: document.getElementById("drawBtn"),
      copy: document.getElementById("copyBtn"),
      download: document.getElementById("downloadBtn"),
      reset: document.getElementById("resetBtn"),
      saveImage: document.getElementById("saveImageBtn"),
      ownerLine: document.getElementById("ownerLine"),
      ownerNameInput: document.getElementById("ownerNameInput"),
      saveOwnerName: document.getElementById("saveOwnerNameBtn"),
      sheetUrlInput: document.getElementById("sheetUrlInput"),
      saveSheetUrl: document.getElementById("saveSheetUrlBtn"),
      reloadSheet: document.getElementById("reloadSheetBtn"),
      copySheetLink: document.getElementById("copySheetLinkBtn"),
      clearSheetUrl: document.getElementById("clearSheetUrlBtn"),
      sheetStatus: document.getElementById("sheetStatus"),
      rosterSelect: document.getElementById("rosterSelect"),
      rosterName: document.getElementById("rosterName"),
      rosterSeries: document.getElementById("rosterSeries"),
      rosterImage: document.getElementById("rosterImage"),
      importRosterFile: document.getElementById("importRosterFile"),
      newCharacter: document.getElementById("newCharacterBtn"),
      saveCharacter: document.getElementById("saveCharacterBtn"),
      deleteCharacter: document.getElementById("deleteCharacterBtn"),
      exportRoster: document.getElementById("exportRosterBtn"),
      importRoster: document.getElementById("importRosterBtn"),
      exportLocal: document.getElementById("exportLocalBtn"),
      localDraftStatus: document.getElementById("localDraftStatus"),
      toast: document.getElementById("toast")
    };

    init();

    async function init() {
      bindEvents();
      renderOwnerName();
      renderSheetSettings();
      if (state.sheetUrl) await loadSheetRoster();
      state.drawnRanks = state.drawnRanks.filter(rank => state.characters.some(item => item.rank === rank));
      restoreLatest();
      if (!state.current) resetDisplay();
      renderStats();
      renderHistory();
      renderRoster();
      renderLocalDraftStatus();
    }

    function bindEvents() {
      els.draw.addEventListener("click", drawCharacter);
      els.copy.addEventListener("click", copyResult);
      els.download.addEventListener("click", downloadCard);
      els.reset.addEventListener("click", resetLottery);
      els.saveImage.addEventListener("click", saveManualImage);
      els.saveOwnerName.addEventListener("click", saveOwnerName);
      els.ownerNameInput.addEventListener("keydown", event => {
        if (event.key === "Enter") saveOwnerName();
      });
      els.saveSheetUrl.addEventListener("click", saveSheetUrl);
      els.reloadSheet.addEventListener("click", () => loadSheetRoster(true));
      els.copySheetLink.addEventListener("click", copySheetShareLink);
      els.clearSheetUrl.addEventListener("click", clearSheetUrl);
      els.sheetUrlInput.addEventListener("keydown", event => {
        if (event.key === "Enter") saveSheetUrl();
      });
      els.rosterSelect.addEventListener("change", loadRosterSelection);
      els.newCharacter.addEventListener("click", clearRosterForm);
      els.saveCharacter.addEventListener("click", saveCharacter);
      els.deleteCharacter.addEventListener("click", deleteCharacter);
      els.exportRoster.addEventListener("click", exportRoster);
      els.importRoster.addEventListener("click", importRoster);
      els.exportLocal.addEventListener("click", exportLocalRoster);
      els.manualUrl.addEventListener("keydown", event => {
        if (event.key === "Enter") saveManualImage();
      });
    }

    function drawCharacter() {
      const remaining = state.characters.filter(item => !state.drawnRanks.includes(item.rank));
      if (!remaining.length) {
        showToast("100 位都抽完了，可以重置後再開一輪。");
        return;
      }

      const selected = remaining[Math.floor(Math.random() * remaining.length)];
      state.current = selected;
      state.drawnRanks.unshift(selected.rank);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.drawnRanks));
      renderResult(selected);
      renderStats();
      renderHistory();
      findImage(selected);
    }

    function restoreLatest() {
      const latestRank = state.drawnRanks[0];
      const latest = state.characters.find(item => item.rank === latestRank);
      if (latest) {
        state.current = latest;
        renderResult(latest);
        setImage(state.customImages[latest.rank] || latest.imageUrl || "");

    function renderStats() {

      els.drawn.textContent = drawn;

    function renderHistory() {
      const items = state.drawnRanks
        .map(rank => state.characters.find(item => item.rank === rank))

    async function findImage(item) {
      if (state.customImages[item.rank] || item.imageUrl) return;
      const now = Date.now();
      const wait = Math.max(0, API_DELAY_MS - (now - state.lastApiAt));
      if (wait) await sleep(wait);
      state.lastApiAt = Date.now();
      els.status.textContent = "正在尋找角色照片...";

      try {
        const candidate = await searchAniList(item) || await searchJikan(item);
        if (candidate) {
          state.customImages[item.rank] = candidate;
          localStorage.setItem(IMAGE_KEY, JSON.stringify(state.customImages));
          if (state.current && state.current.rank === item.rank) setImage(candidate);
          els.status.textContent = "已自動找到照片。";
        } else {
          els.status.innerHTML = `暫時找不到合適照片。<a href="${imageSearchUrl(item)}" target="_blank" rel="noreferrer">開啟圖片搜尋</a>`;
        }
      } catch (error) {
        els.status.innerHTML = `照片查詢連線失敗。<a href="${imageSearchUrl(item)}" target="_blank" rel="noreferrer">開啟圖片搜尋</a>`;
      }
    }

    async function searchAniList(item) {
      const query = `
        query ($search: String) {
          Page(page: 1, perPage: 4) {
            characters(search: $search, sort: FAVOURITES_DESC) {
              name { full native alternative }
              image { large }
            }
          }
        }
      `;
      const searches = [item.alias, PHOTO_ALIASES[item.rank], item.name].filter(Boolean);

      for (const search of searches) {
        try {
          const response = await fetch("https://graphql.anilist.co", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, variables: { search } })
          });
          if (!response.ok) continue;
          const payload = await response.json();
          const results = payload.data?.Page?.characters || [];
          const image = pickBestAniListImage(results, item, search);
          if (image) return image;
        } catch (error) {
          continue;
        }
      }

      return "";
    }

    async function searchJikan(item) {
      const searches = [item.alias, PHOTO_ALIASES[item.rank], `${item.name} ${item.series}`, item.name].filter(Boolean);
      for (const search of searches) {
        try {
          const query = encodeURIComponent(search);
          const response = await fetch(`https://api.jikan.moe/v4/characters?q=${query}&limit=5`);
          if (!response.ok) continue;
          const payload = await response.json();
          const image = pickBestImage(payload.data || [], item, search);
          if (image) return image;
        } catch (error) {
          continue;
        }
      }
      return "";
    }

    function pickBestAniListImage(results, item, search) {
      if (!results.length) return "";
      const tokens = `${search} ${item.name}`.toLowerCase().split(/\s+/).filter(Boolean);
      const scored = results.map(result => {
        const about = `${result.name?.full || ""} ${result.name?.native || ""} ${(result.name?.alternative || []).join(" ")}`.toLowerCase();
        const score = tokens.reduce((total, token) => total + (about.includes(token) ? 1 : 0), 0);
        return { score, url: result.image?.large || "" };
      }).filter(entry => entry.url);
      scored.sort((a, b) => b.score - a.score);
      return scored[0]?.url || "";
    }

    function pickBestImage(results, item, search) {
      if (!results.length) return "";
      const itemText = `${search} ${item.name} ${item.series}`.toLowerCase();
      const scored = results.map(result => {
        const about = `${result.name || ""} ${(result.nicknames || []).join(" ")}`.toLowerCase();
        const score = itemText.split(/\s+/).reduce((total, token) => total + (token && about.includes(token) ? 1 : 0), 0);
        return { score, url: result.images?.jpg?.image_url || result.images?.webp?.image_url || "" };
      }).filter(entry => entry.url);

      scored.sort((a, b) => b.score - a.score);
      return scored[0]?.url || "";
    }

    function downloadCard() {
      if (!state.current) {
        showToast("先抽一名角色，再下載卡片。");
        return;
      }

      const canvas = document.createElement("canvas");
      canvas.width = 1200;
      canvas.height = 675;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 1200, 675);
      gradient.addColorStop(0, "#fbf7ee");
      gradient.addColorStop(.55, "#fffdf8");
      gradient.addColorStop(1, "#e6f1ef");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1200, 675);

      ctx.fillStyle = "#d64045";
      ctx.fillRect(0, 0, 18, 675);
      ctx.fillStyle = "#167c80";
      ctx.fillRect(18, 0, 10, 675);

      const img = els.portrait.classList.contains("has-image") ? els.image : null;
      if (img && img.complete) {
        try {
          coverImage(ctx, img, 56, 62, 360, 520);
        } catch (error) {
          drawPlaceholder(ctx, 56, 62, 360, 520);
        }
      } else {
        drawPlaceholder(ctx, 56, 62, 360, 520);
      }

      ctx.fillStyle = "#d64045";
      roundRect(ctx, 456, 78, 118, 52, 26);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 28px Microsoft JhengHei, sans-serif";
      ctx.fillText(`#${state.current.rank}`, 488, 114);

      ctx.fillStyle = "#167c80";
      ctx.font = "700 28px Microsoft JhengHei, sans-serif";
      ctx.fillText("本次抽中", 456, 180);

      ctx.fillStyle = "#221f1b";
      fitText(ctx, state.current.name, 456, 285, 680, 78, 42);

      ctx.fillStyle = "#776f64";
      ctx.font = "32px Microsoft JhengHei, sans-serif";
      wrapText(ctx, state.current.series, 456, 378, 660, 46);

      ctx.fillStyle = "#c9942f";
      ctx.font = "700 24px Microsoft JhengHei, sans-serif";
      ctx.fillText(state.ownerName ? `${state.ownerName} 的動漫女角色抽籤箱` : "動漫女角色抽籤箱", 456, 570);

      const link = document.createElement("a");
      link.download = `${state.current.rank}-${state.current.name}-抽籤結果.png`;
      try {
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (error) {
        showToast("這張外部圖片不允許下載成卡片，但仍可複製文字結果。");
      }
    }

    async function saveSheetUrl() {
      const url = els.sheetUrlInput.value.trim();
      if (!url) {
        showToast("請先貼上 Google Sheet CSV 連結。");

    async function loadSheetRoster(showSuccess = false) {
      if (!state.sheetUrl) {
        renderSheetSettings();
        return;
      }

      els.sheetStatus.textContent = "正在讀取 Google Sheet...";
      try {
        const resolvedUrl = await resolveSheetUrl(state.sheetUrl);
        let imported = [];
        let csvResult = { characters: [], rowCount: 0 };

        if (isAppsScriptUrl(resolvedUrl)) {
          imported = await loadAppsScriptRoster(resolvedUrl);
        } else {
          csvResult = await loadCsvRoster(resolvedUrl);
          imported = csvResult.characters;
          if (!imported.length) imported = await loadGvizRoster(resolvedUrl);
        }

        if (!imported.length) throw new Error("empty sheet");

        state.characters = mergeCharacters(imported, state.localCharacters);
        state.drawnRanks = state.drawnRanks.filter(rank => state.characters.some(item => item.rank === rank));
        state.current = state.current ? state.characters.find(item => item.rank === state.current.rank) || null : null;
        state.sheetUrl = resolvedUrl;
        localStorage.setItem(SHEET_URL_KEY, state.sheetUrl);
        localStorage.setItem(ROSTER_KEY, JSON.stringify(state.characters));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.drawnRanks));

        restoreLatest();
        if (!state.current) resetDisplay();
      renderStats();
      renderHistory();
      renderRoster();
      renderLocalDraftStatus();
      renderSheetSettings(`已同步 ${state.characters.length} 位角色。`);
        if (showSuccess) showToast("已載入 Google Sheet 名單。");
      } catch (error) {
        const message = error.message === "header only"
          ? "公開 Sheet 目前只有表頭，沒有角色資料列。請確認資料已匯入同一個分頁，並重新發佈到網路。"
          : "讀取失敗，已使用本機名單。請確認 Sheet 已發佈到網路，或把共用權限設為知道連結者可查看。";
        renderSheetSettings(message);
      }
    }

    async function loadCsvRoster(url) {
      try {
        const response = await fetch(withCacheBuster(url));
        if (!response.ok) return { characters: [], rowCount: 0 };
        const csv = await response.text();
        const rowCount = parseCsvRows(csv).filter(row => row.some(cell => cell.trim())).length;
        const characters = normalizeCharacters(parseCsvRoster(csv));
        if (!characters.length && rowCount === 1) throw new Error("header only");
        return { characters, rowCount };
      } catch (error) {
        if (error.message === "header only") throw error;
        return { characters: [], rowCount: 0 };
      }
    }

    async function resolveSheetUrl(url) {
      const normalized = normalizeSheetUrl(url);
      if (!normalized.includes("/pub?gid=0") || /[#&?]gid=0/.test(url)) return normalized;

      try {
        const publishedHtml = url.replace(/\/pub(?:html)?[\s\S]*$/, "/pubhtml");
        const response = await fetch(withCacheBuster(publishedHtml));
        if (!response.ok) return normalized;
        const html = await response.text();
        const gid = html.match(/gid[=\\x3d](\d+)/)?.[1] || html.match(/gid:\s*"(\d+)"/)?.[1];
        if (!gid) return normalized;
        return normalized.replace(/gid=0/, `gid=${gid}`);
      } catch (error) {
        return normalized;
      }
    }

    async function loadGvizRoster(url) {
      const gvizUrl = getGvizUrl(url);
      if (!gvizUrl) return [];

      return new Promise(resolve => {
        const previousGoogle = window.google;
        const script = document.createElement("script");
        const timeout = setTimeout(() => cleanup([]), 10000);

        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = window.google.visualization.Query || {};
        window.google.visualization.Query.setResponse = payload => {
          cleanup(normalizeCharacters(parseGvizRoster(payload)));
        };

        script.onerror = () => cleanup([]);
        script.src = withCacheBuster(gvizUrl);
        document.head.appendChild(script);

        function cleanup(result) {
          clearTimeout(timeout);
          script.remove();
          if (previousGoogle) {
            window.google = previousGoogle;
          }
          resolve(result);
        }
      });
    }

    async function loadAppsScriptRoster(url) {
      return new Promise(resolve => {
        const callbackName = `animeLotterySheet_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const script = document.createElement("script");
        const timeout = setTimeout(() => cleanup([]), 10000);

        window[callbackName] = payload => {
          const rows = Array.isArray(payload) ? payload : payload?.characters || [];
          cleanup(normalizeCharacters(rows));
        };

        script.onerror = () => cleanup([]);
        script.src = addQueryParam(url, "callback", callbackName);
        document.head.appendChild(script);

        function cleanup(result) {
          clearTimeout(timeout);
          script.remove();
          delete window[callbackName];
          resolve(result);
        }
      });
    }

      els.rosterSeries.value = "";
      els.rosterImage.value = "";

    }

    function saveCharacter() {
      const name = els.rosterName.value.trim();
      const series = els.rosterSeries.value.trim();
      const imageUrl = els.rosterImage.value.trim();

      if (!name || !series) {
        showToast("角色名稱和作品名稱都要填。");
        return;
      }

      const selectedRank = Number(els.rosterSelect.value);
      const existing = state.characters.find(item => item.rank === selectedRank);

      if (existing) {
        existing.name = name;
        existing.series = series;
        existing.imageUrl = imageUrl;
        existing.localOnly = true;
        if (imageUrl) state.customImages[existing.rank] = imageUrl;
        if (!imageUrl) delete state.customImages[existing.rank];
        state.current = state.current?.rank === existing.rank ? existing : state.current;
      } else {
        const nextRank = getNextRank();
        const item = { rank: nextRank, name, series, imageUrl, localOnly: true };
        state.characters.push(item);
        state.characters.sort((a, b) => a.rank - b.rank);
        if (imageUrl) state.customImages[nextRank] = imageUrl;
        els.rosterSelect.value = String(nextRank);
      }

      const savedRank = existing ? existing.rank : Number(els.rosterSelect.value);
      saveRosterState();
      renderStats();
      renderHistory();
      renderRoster();
      renderLocalDraftStatus();
      els.rosterSelect.value = String(savedRank);
      if (state.current) renderResult(state.current);
      showToast(existing ? "角色資料已更新。" : "新角色已加入抽籤箱。");
    }

    function deleteCharacter() {
      const rank = Number(els.rosterSelect.value);
      const item = state.characters.find(character => character.rank === rank);
      if (!item) {
        showToast("請先從名單選一位角色。");
        return;
      }

      const ok = confirm(`確定刪除「${item.name}」嗎？`);
      if (!ok) return;

      state.characters = state.characters.filter(character => character.rank !== rank);
      state.localCharacters = state.localCharacters.filter(character => character.rank !== rank);
      state.drawnRanks = state.drawnRanks.filter(drawnRank => drawnRank !== rank);
      delete state.customImages[rank];
      if (state.current?.rank === rank) state.current = null;

      saveRosterState();
      clearRosterForm();
      renderStats();
      renderHistory();
      renderRoster();
      renderLocalDraftStatus();
      if (!state.current) resetDisplay();
      showToast("角色已刪除。");
    }

    function downloadJson(data, filename) {
      const payload = JSON.stringify(data, null, 2);
      const blob = new Blob([payload], { type: "application/json;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function resetDisplay() {
      els.rank.textContent = "READY";
      els.eyebrow.textContent = "二創挑戰名單";

      els.series.textContent = `按下抽選，從 ${state.characters.length} 位角色裡抽出不重複結果。`;
      els.status.textContent = "";
      els.manualUrl.value = "";
      setImage("");
    }

    function getNextRank() {
      return state.characters.reduce((max, item) => Math.max(max, Number(item.rank) || 0), 0) + 1;
    }

    function mergeCharacters(remoteCharacters, localCharacters) {
      const byRank = new Map();
      remoteCharacters.forEach(item => byRank.set(item.rank, { ...item, localOnly: false }));
      localCharacters.forEach(item => {
        byRank.set(item.rank, { ...item, localOnly: true });
      });
      return [...byRank.values()].sort((a, b) => a.rank - b.rank);
    }

    function imageSearchUrl(item) {
      return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(`${item.name} ${item.series} 角色`)}`;
    }

    function normalizeSheetUrl(url) {
      const cleaned = url.trim().replace(/&amp;/g, "&");
      if (isAppsScriptUrl(cleaned)) return cleaned;

      const published = cleaned.match(/docs\.google\.com\/spreadsheets\/d\/e\/([^/]+)/);
      if (published) {
        const gid = cleaned.match(/[#&?]gid=(\d+)/)?.[1] || "0";
        return `https://docs.google.com/spreadsheets/d/e/${published[1]}/pub?gid=${gid}&single=true&output=csv`;
      }

      const match = cleaned.match(/docs\.google\.com\/spreadsheets\/d\/([^/]+)/);
      if (!match || cleaned.includes("/pub?") || cleaned.includes("output=csv")) return cleaned;

      const parsed = new URL(cleaned);
      const gid = parsed.searchParams.get("gid") || cleaned.match(/[#&?]gid=(\d+)/)?.[1] || "0";
      return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&gid=${gid}`;
    }

    function withCacheBuster(url) {
      return addQueryParam(url, "_", Date.now());
    }

    function addQueryParam(url, key, value) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}${encodeURIComponent(key)}=${encodeURIComponent(value)}`;
    }

    function isAppsScriptUrl(url) {
      return /^https:\/\/script\.google\.com\/macros\/s\//.test(url);
    }

    function getGvizUrl(url) {
      const cleaned = normalizeSheetUrl(url);
      const standard = cleaned.match(/docs\.google\.com\/spreadsheets\/d\/([^/]+)/);
      if (cleaned.includes("/d/e/")) return "";
      const id = standard?.[1];
      if (!id) return "";

      let gid = "0";
      try {
        const parsed = new URL(cleaned);
        gid = parsed.searchParams.get("gid") || cleaned.match(/[#&?]gid=(\d+)/)?.[1] || "0";
      } catch (error) {
        gid = cleaned.match(/[#&?]gid=(\d+)/)?.[1] || "0";
      }

      return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&gid=${gid}`;
    }

    function parseCsvRoster(csv) {
      const rows = parseCsvRows(csv).filter(row => row.some(cell => cell.trim()));
      return parseRosterRows(rows);
    }

    function findHeader(header, names) {
      return header.findIndex(cell => names.includes(cell.replace(/\s+/g, "")) || names.includes(cell));
    }

    function parseCsvRows(csv) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let index = 0; index < csv.length; index += 1) {
        const char = csv[index];
        const next = csv[index + 1];

        if (quoted) {
          if (char === '"' && next === '"') {
            cell += '"';
            index += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(cell);
          cell = "";
        } else if (char === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (char !== "\r") {
          cell += char;
        }
      }

      row.push(cell);
      rows.push(row);
      return rows;
    }

    function parseGvizRoster(payload) {
      const table = payload?.table;
      if (!table?.cols?.length || !table?.rows?.length) return [];

      const header = table.cols.map(col => String(col.label || "").trim());
      const rows = table.rows.map(row => (row.c || []).map(cell => cell?.f ?? cell?.v ?? ""));
      const hasHeader = header.some(Boolean);
      return parseRosterRows(hasHeader ? [header, ...rows] : rows);
    }

    function parseRosterRows(rows) {
      const cleanedRows = rows.filter(row => row.some(cell => String(cell).trim()));
      if (!cleanedRows.length) return [];

      const header = cleanedRows[0].map(cell => String(cell).trim().toLowerCase());
      const hasHeader = header.some(cell => ["name", "角色名稱", "角色", "series", "作品名稱", "作品"].includes(cell));
      const body = hasHeader ? cleanedRows.slice(1) : cleanedRows;

      const indexes = {
        rank: findHeader(header, ["rank", "排名", "編號", "id"]),
        name: findHeader(header, ["name", "角色名稱", "角色"]),
        series: findHeader(header, ["series", "作品名稱", "作品"]),
        imageUrl: findHeader(header, ["imageurl", "image", "photo", "照片網址", "圖片網址", "照片", "圖片"]),
        alias: findHeader(header, ["alias", "search", "英文名", "羅馬拼音", "搜尋名"])
      };

      return body.map((row, index) => ({
        rank: indexes.rank >= 0 ? row[indexes.rank] : index + 1,
        name: row[indexes.name >= 0 ? indexes.name : 0],
        series: row[indexes.series >= 0 ? indexes.series : 1],
        imageUrl: indexes.imageUrl >= 0 ? row[indexes.imageUrl] : "",
        alias: indexes.alias >= 0 ? row[indexes.alias] : ""
      }));
    }

    function normalizeCharacters(characters) {
      return characters
        .map((item, index) => ({
          rank: Number(item.rank) || index + 1,
          name: String(item.name || "").trim(),
          series: String(item.series || "").trim(),
          imageUrl: String(item.imageUrl || "").trim(),
          alias: String(item.alias || "").trim(),
          localOnly: Boolean(item.localOnly)
        }))
        .filter(item => item.name && item.series)
        .sort((a, b) => a.rank - b.rank);
    }

    function readJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function coverImage(ctx, img, x, y, width, height) {
      const scale = Math.max(width / img.naturalWidth, height / img.naturalHeight);
      const sw = width / scale;
      const sh = height / scale;
      const sx = (img.naturalWidth - sw) / 2;
      const sy = (img.naturalHeight - sh) / 2;
      ctx.save();
      roundRect(ctx, x, y, width, height, 24);
      ctx.clip();
      ctx.drawImage(img, sx, sy, sw, sh, x, y, width, height);
      ctx.restore();
    }

    function drawPlaceholder(ctx, x, y, width, height) {
      ctx.fillStyle = "#f0e7d8";
      roundRect(ctx, x, y, width, height, 24);
      ctx.fill();
      ctx.fillStyle = "#776f64";
      ctx.font = "700 34px Microsoft JhengHei, sans-serif";
      ctx.fillText("CHARACTER", x + 78, y + 250);
    }

    function fitText(ctx, text, x, y, maxWidth, startSize, minSize) {
      let size = startSize;
      do {
        ctx.font = `800 ${size}px Microsoft JhengHei, sans-serif`;
        if (ctx.measureText(text).width <= maxWidth) break;
        size -= 4;
      } while (size >= minSize);
      wrapText(ctx, text, x, y, maxWidth, size + 10);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      let line = "";
      let currentY = y;
      for (const char of text) {
        const testLine = line + char;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, x, currentY);
          line = char;
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line) ctx.fillText(line, x, currentY);
    }
  </script>
